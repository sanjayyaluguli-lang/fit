# XcodeGen spec. The .xcodeproj is generated, not committed — a hand-merged
# pbxproj is the classic way a solo project becomes unmaintainable.
#
#   brew install xcodegen && xcodegen generate && open Autonomy.xcodeproj
name: Autonomy
options:
  bundleIdPrefix: com.autonomy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AutonomyKit:
    path: .

targets:
  Autonomy:
    type: application
    platform: iOS
    sources:
      - path: App/Autonomy
    dependencies:
      - package: AutonomyKit
    info:
      path: App/Autonomy/Info.plist
      properties:
        CFBundleDisplayName: Autonomy
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSHealthShareUsageDescription: >-
          Autonomy reads your workouts, heart rate, HRV, sleep, steps and weight
          so your readiness and long-term trends reflect what actually happened.
          This data stays on your device.
        NSHealthUpdateUsageDescription: >-
          Autonomy writes the sessions you log here back to Apple Health so your
          activity record stays complete.
        # Left empty in the repo. Add your own key locally if you want video
        # titles fetched automatically; everything works without it.
        YouTubeAPIKey: ""
    entitlements:
      path: App/Autonomy/Autonomy.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
